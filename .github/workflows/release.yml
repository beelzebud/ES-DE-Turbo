name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Windows x64 portable zip
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Add 7-Zip to PATH
        shell: pwsh
        run: |
          if (Test-Path 'C:\Program Files\7-Zip') {
            Add-Content $env:GITHUB_PATH 'C:\Program Files\7-Zip'
          }

      - name: Set up external dependencies
        shell: cmd
        run: call tools\Windows_dependencies_setup.bat

      - name: Build external dependencies
        shell: cmd
        run: call tools\Windows_dependencies_build.bat

      - name: Configure
        shell: cmd
        run: cmake -G Ninja -DCMAKE_BUILD_TYPE=Release .

      - name: Build
        shell: cmd
        run: cmake --build . -j %NUMBER_OF_PROCESSORS%

      - name: Package portable zip
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME -replace '^v', ''
          $staging = "ES-DE-Turbo-$version-x64_Portable"
          $zip = "$staging.zip"
          if (Test-Path $staging) { Remove-Item -Recurse -Force $staging }

          New-Item -ItemType Directory -Path $staging | Out-Null
          Copy-Item -Path 'ES-DE.exe' -Destination $staging
          Get-ChildItem -Path '*.dll' | Copy-Item -Destination $staging
          Copy-Item -Path 'resources','themes','licenses' -Destination $staging -Recurse

          New-Item -ItemType Directory -Path "$staging/es-pdf-converter" | Out-Null
          Copy-Item -Path 'es-pdf-converter/es-pdf-convert.exe' -Destination "$staging/es-pdf-converter/"
          Get-ChildItem -Path 'es-pdf-converter/*.dll' | Copy-Item -Destination "$staging/es-pdf-converter/"

          Copy-Item -Path 'LICENSE','README.md','CHANGELOG.md','FASTLOADING.md' -Destination $staging
          New-Item -ItemType File -Path "$staging/portable.txt" | Out-Null

          7z a -tzip -mx=7 $zip $staging

          $md5 = (Get-FileHash -Path $zip -Algorithm MD5).Hash.ToLower()
          @{ name = 'WindowsPortable'; filename = $zip; md5 = $md5 } |
            ConvertTo-Json | Set-Content -Path 'meta-windows.json'

          Write-Output "Built $zip"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            ES-DE-Turbo-*.zip
            meta-windows.json

  build-linux:
    name: Linux x64 AppImage
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential clang-format git cmake gettext \
            libharfbuzz-dev libicu-dev libsdl2-dev \
            libavcodec-dev libavfilter-dev libavformat-dev libavutil-dev \
            libfreeimage-dev libfreetype6-dev libgit2-dev libcurl4-openssl-dev \
            libpugixml-dev libasound2-dev libbluetooth-dev libgl1-mesa-dev \
            libpoppler-cpp-dev libpipewire-0.3-dev libfuse2

      - name: Build AppImage
        env:
          APPIMAGE_EXTRACT_AND_RUN: '1'
        run: bash tools/create_AppImage.sh

      - name: Rename and record checksum
        run: |
          version="${GITHUB_REF_NAME#v}"
          mv ES-DE_x64.AppImage "ES-DE-Turbo-${version}-x64.AppImage"
          md5=$(md5sum "ES-DE-Turbo-${version}-x64.AppImage" | awk '{print $1}')
          printf '{"name":"LinuxAppImage","filename":"ES-DE-Turbo-%s-x64.AppImage","md5":"%s"}' \
            "$version" "$md5" > meta-linux.json

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux
          path: |
            ES-DE-Turbo-*.AppImage
            meta-linux.json

  publish:
    name: Publish release
    needs: [build-windows, build-linux]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate tag and capture version info
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          header_version=$(sed -n 's/^#define PROGRAM_VERSION_STRING "\([^"]*\)"/\1/p' es-core/src/ApplicationVersion.h)
          if [ "$tag_version" != "$header_version" ]; then
            echo "Tag '$tag_version' does not match PROGRAM_VERSION_STRING '$header_version'" >&2
            exit 1
          fi
          release_num=$(sed -n 's/^#define PROGRAM_RELEASE_NUMBER *\([0-9]*\).*/\1/p' es-core/src/ApplicationVersion.h)
          echo "VERSION=$tag_version" >> "$GITHUB_ENV"
          echo "RELEASE_NUM=$release_num" >> "$GITHUB_ENV"
          echo "RELEASE_DATE=$(date +%F)" >> "$GITHUB_ENV"
          echo "Tag version '$tag_version' (release $release_num) matches PROGRAM_VERSION_STRING"

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: artifacts

      - name: Generate checksums
        run: |
          : > CHECKSUMS.txt
          for f in artifacts/ES-DE-Turbo-*; do
            [ -f "$f" ] || continue
            printf '%s  %s\n' "$(sha256sum "$f" | cut -d' ' -f1)" "$(basename "$f")" >> CHECKSUMS.txt
          done
          cat CHECKSUMS.txt

      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/ES-DE-Turbo-*.zip
            artifacts/ES-DE-Turbo-*.AppImage
            CHECKSUMS.txt
          generate_release_notes: true

      - name: Update release feed
        run: |
          git fetch --depth=1 origin main
          git checkout -B main origin/main

          python3 - <<'PY'
          import json
          import glob
          import os

          version = os.environ['VERSION']
          release_num = os.environ['RELEASE_NUM']
          release_date = os.environ['RELEASE_DATE']
          tag = os.environ['GITHUB_REF_NAME']
          repo = os.environ['GITHUB_REPOSITORY']

          with open('latest_release.json') as f:
              data = json.load(f)

          stable = data['stable']
          stable['version'] = version
          stable['release'] = release_num
          stable['date'] = release_date

          for meta_file in sorted(glob.glob('artifacts/meta-*.json')):
              with open(meta_file) as f:
                  meta = json.load(f)
              filename = meta['filename']
              url = f'https://github.com/{repo}/releases/download/{tag}/{filename}'
              pkg = next((p for p in stable['packages'] if p.get('name') == meta['name']), None)
              if pkg is None:
                  pkg = {'name': meta['name'], 'message': ''}
                  stable['packages'].append(pkg)
              pkg['filename'] = filename
              pkg['url'] = url
              pkg['md5'] = meta['md5']

          with open('latest_release.json', 'w') as f:
              json.dump(data, f, indent=4)
              f.write('\n')
          PY

          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add latest_release.json
          if git diff --cached --quiet; then
            echo 'latest_release.json unchanged, nothing to commit'
          else
            git commit -m "Update latest_release.json for $VERSION"
            git push origin main
          fi
